---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ppid2026/Laravel-Core
    - /bin/cp -r app resources routes database config bootstrap public $DEPLOYPATH/
    - /bin/cp -rf public/index.php /home/ppid2026/public_html/index.php 2>/dev/null || true
    - /bin/cp -rf public/images/. /home/ppid2026/public_html/images/ 2>/dev/null || true
    - /bin/cp -f .cpanel.yml $DEPLOYPATH/.cpanel.yml
    - cd $DEPLOYPATH && php artisan config:clear
    - cd $DEPLOYPATH && php artisan cache:clear
    - cd $DEPLOYPATH && php artisan view:clear
    - cd $DEPLOYPATH && php artisan route:clear
    - cd $DEPLOYPATH && php artisan migrate --force